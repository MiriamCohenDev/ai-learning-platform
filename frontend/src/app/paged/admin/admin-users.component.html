<h2>All Users</h2>

<div class="users-container">
  <div class="user-card" *ngFor="let user of users">
    <div class="user-info">
      <div class="user-name">{{ user.name }}</div>
      <div class="user-id">ID: {{ user.idNumber }}</div>
      <div class="user-phone">Phone: {{ user.phone }}</div>
    </div>
    <button class="view-btn" (click)="openHistory(user._id)">
      View History
    </button>
  </div>
</div>
