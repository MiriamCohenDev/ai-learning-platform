<div class="main-content" *ngIf="isLoaded; else loading">
  <button class="back-btn" (click)="goBack()">
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
      <path d="M19 12H5M12 19l7-7-7-7" />
    </svg>
  </button>

  <div class="lesson-card" *ngIf="lesson">
    <h2 class="lesson-title">{{ lesson.prompt }}</h2>

    <div class="lesson-meta">
      <span><strong>Category:</strong> {{ lesson.categoryId.name }}</span>
      <span><strong>SubCategory:</strong> {{ lesson.subCategoryId.name }}</span>
      <span><strong>Created:</strong> {{ lesson.createdAt | date:'dd/MM/yyyy HH:mm' }}</span>
    </div>

    <div class="lesson-response">
      <pre>{{ lesson.response }}</pre>
    </div>
  </div>
</div>

<ng-template #loading>
  <p class="loading-text">Loading lesson...</p>
</ng-template>
