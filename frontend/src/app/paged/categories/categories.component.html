<div class="page-container">
  <div class="page-card">
    <button class="back-btn" (click)="goBack()">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
        <path d="M19 12H5M12 19l7-7-7-7" />
      </svg>
    </button>
    <h2>Choose Category</h2>
    <p class="subtitle">Select a category to see available lessons</p>

    <div *ngIf="loading()" class="loader">Loading categories...</div>
    <div *ngIf="error()" class="alert alert-error">{{ error() }}</div>

    <div class="grid" *ngIf="!loading() && categories().length">
      <button class="cat-card" *ngFor="let c of categories()" (click)="openCategory(c._id)">
        <div class="cat-name">{{ c.name }}</div>
      </button>
    </div>

    <div *ngIf="!loading() && !categories().length" class="empty">No categories found.</div>
  </div>
</div>
